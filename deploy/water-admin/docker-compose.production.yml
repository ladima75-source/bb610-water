name: bb610-water-admin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BB610_ADMIN_DATA_ROOT:-/var/lib/bb610-water-admin}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  api:
    build:
      context: ../../services/water-admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BB610_ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BB610_ADMIN_JWT_SECRET: ${BB610_ADMIN_JWT_SECRET}
      BB610_ADMIN_JWT_ISSUER: ${BB610_ADMIN_JWT_ISSUER:-bb610-water-admin}
      BB610_ADMIN_JWT_TTL_MIN: ${BB610_ADMIN_JWT_TTL_MIN:-60}
      BB610_ADMIN_LOGIN_MAX_FAILURES: ${BB610_ADMIN_LOGIN_MAX_FAILURES:-5}
      BB610_ADMIN_LOGIN_BLOCK_MIN: ${BB610_ADMIN_LOGIN_BLOCK_MIN:-15}
      BB610_ADMIN_BOOTSTRAP_EMAIL: ${BB610_ADMIN_BOOTSTRAP_EMAIL:-}
      BB610_ADMIN_BOOTSTRAP_PASSWORD: ${BB610_ADMIN_BOOTSTRAP_PASSWORD:-}
      BB610_ADMIN_CORS_ORIGINS: ${BB610_ADMIN_CORS_ORIGINS}
    ports:
      - "127.0.0.1:${BB610_ADMIN_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

networks:
  backend:
    driver: bridge
