# BB610 WATER Admin/API reverse proxy template.
# Requires owner-approved DNS and certificates before activation.

limit_req_zone $binary_remote_addr zone=bb610_water_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.water.bb610.com.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.water.bb610.com.ua;

    ssl_certificate /etc/letsencrypt/live/admin.water.bb610.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.water.bb610.com.ua/privkey.pem;

    root /opt/bb610-water-admin/admin-ui;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://api.water.bb610.com.ua; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /config.js {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/bb610-water-admin.access.log;
    error_log /var/log/nginx/bb610-water-admin.error.log warn;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.water.bb610.com.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.water.bb610.com.ua;

    ssl_certificate /etc/letsencrypt/live/api.water.bb610.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.water.bb610.com.ua/privkey.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /auth/token {
        limit_req zone=bb610_water_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    access_log /var/log/nginx/bb610-water-api.access.log;
    error_log /var/log/nginx/bb610-water-api.error.log warn;
}
