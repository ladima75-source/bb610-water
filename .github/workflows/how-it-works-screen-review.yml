name: HOW IT WORKS Screen 4 Review
on:
  push:
    branches: [review/how-it-works-screen-4-refine, review/screen4-flow-images-fix]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve repository root
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/how-http.log 2>&1 &
      - name: Validate HOW IT WORKS screen
        run: node .github/scripts/how-it-works-screen-review.mjs
